<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Generator</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); text-align: center; max-width: 400px; width: 100%; }
        h2 { color: var(--accent); margin-top: 0; }
        .pass-box { background: #0f172a; padding: 15px; border-radius: 6px; font-size: 20px; color: var(--accent); font-weight: bold; margin-bottom: 20px; border: 2px solid #475569; word-break: break-all; }
        button { background: var(--accent); color: #0f172a; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
<div class="container">
    <h2>Password Generator</h2>
    <div id="passwordDisplay" class="pass-box">Click Generate</div>
    <button onclick="generate()">Generate Secure Password</button>
</div>
<script>
    function generate() {
        let chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+~`|}{[]:;?><,./-=";
        let password = "";
        for (let i = 0; i < 16; i++) {
            password += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        document.getElementById('passwordDisplay').innerText = password;
    }
</script>
</body>
</html>
