<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer Tool</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --accent-active: #004494;
            --border: #d2d2d7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .timer-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 32px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .timer-title {
            margin: 0 0 24px 0;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .countdown-display {
            display: flex;
            justify-content: space-between;
            margin-bottom: 32px;
            gap: 12px;
        }

        .time-block {
            flex: 1;
            background: var(--bg-color);
            padding: 12px 4px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1.1;
        }

        .time-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .timer-controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .date-input-wrapper {
            position: relative;
            text-align: left;
        }

        .date-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .date-picker {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            font-family: inherit;
            background: var(--card-bg);
            color: var(--text-primary);
        }

        .date-picker:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
        }

        .timer-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
            width: 100%;
        }

        .timer-btn:hover {
            background-color: var(--accent-active);
        }

        .timer-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="timer-container">
    <h2 class="timer-title">Countdown Timer</h2>
    
    <div class="countdown-display">
        <div class="time-block">
            <span id="days" class="time-number">00</span>
            <span class="time-label">Days</span>
        </div>
        <div class="time-block">
            <span id="hours" class="time-number">00</span>
            <span class="time-label">Hours</span>
        </div>
        <div class="time-block">
            <span id="minutes" class="time-number">00</span>
            <span class="time-label">Mins</span>
        </div>
        <div class="time-block">
            <span id="seconds" class="time-number">00</span>
            <span class="time-label">Secs</span>
        </div>
    </div>
    
    <div class="timer-controls">
        <div class="date-input-wrapper">
            <label for="target-date" class="date-label">Select Target Date & Time</label>
            <input type="datetime-local" id="target-date" class="date-picker">
        </div>
        <button id="start-btn" class="timer-btn">Start Countdown</button>
    </div>
</div>

<script>
(function() {
    let countdownInterval;

    const startBtn = document.getElementById('start-btn');
    const datePicker = document.getElementById('target-date');

    startBtn.addEventListener('click', function() {
        const targetInput = datePicker.value;
        if (!targetInput) return alert('Please select a valid date and time.');

        const targetTime = new Date(targetInput).getTime();
        
        clearInterval(countdownInterval);
        localStorage.setItem('savedTargetTime', targetTime);

        startCountdown(targetTime);
    });

    function startCountdown(endTime) {
        function updateTimer() {
            const now = new Date().getTime();
            const distance = endTime - now;

            if (distance < 0) {
                clearInterval(countdownInterval);
                document.getElementById('days').innerText = '00';
                document.getElementById('hours').innerText = '00';
                document.getElementById('minutes').innerText = '00';
                document.getElementById('seconds').innerText = '00';
                localStorage.removeItem('savedTargetTime');
                return;
            }

            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(d).padStart(2, '0');
            document.getElementById('hours').innerText = String(h).padStart(2, '0');
            document.getElementById('minutes').innerText = String(m).padStart(2, '0');
            document.getElementById('seconds').innerText = String(s).padStart(2, '0');
        }

        updateTimer();
        countdownInterval = setInterval(updateTimer, 1000);
    }

    // Restore timer if one was previously set
    const savedTime = localStorage.getItem('savedTargetTime');
    if (savedTime) {
        startCountdown(parseInt(savedTime));
        // Fill input field with the saved date formatted for datetime-local
        const dateObj = new Date(parseInt(savedTime));
        const tzOffset = dateObj.getTimezoneOffset() * 60000;
        const localISOTime = (new Date(dateObj - tzOffset)).toISOString().slice(0, 16);
        datePicker.value = localISOTime;
    }
})();
</script>

</body>
</html>
