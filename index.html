<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPM to Stenography Speed Converter</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }
        body {
            font-family: system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { color: var(--accent); margin-top: 0; }
        input {
            width: 80%;
            padding: 12px;
            border: 2px solid #475569;
            background: #0f172a;
            color: white;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
        }
        input:focus { border-color: var(--accent); outline: none; }
        .result { margin-top: 25px; font-size: 18px; }
        .bold-res { font-size: 28px; color: var(--accent); font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>WPM to Steno Converter</h2>
    <p>Enter your standard typing speed (WPM) to calculate your estimated Stenography output:</p>
    <input type="number" id="wpmInput" placeholder="e.g. 80" oninput="calculateSteno()">
    
    <div class="result">
        <div>Estimated Steno Strokes Per Minute:</div>
        <div id="strokeResult" class="bold-res">0</div>
    </div>
</div>

<script>
    function calculateSteno() {
        let wpm = document.getElementById('wpmInput').value;
        if(wpm < 0 || wpm === '') wpm = 0;
        // Standard structural formula: 1 WPM is roughly equivalent to 2.3 Steno strokes/minute
        let strokes = Math.round(wpm * 2.3);
        document.getElementById('strokeResult').innerText = strokes.toLocaleString();
    }
</script>

</body>
</html>
