<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebToolBox - Free Online Tools</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --accent-active: #004494;
            --border: #d2d2d7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .tools-grid {
            display: flex;
            flex-direction: column;
            gap: 32px;
            max-width: 500px;
            margin: 0 auto;
        }

        .tool-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .tool-title {
            margin: 0 0 24px 0;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        /* Countdown Display Styles */
        .countdown-display {
            display: flex;
            justify-content: space-between;
            margin-bottom: 32px;
            gap: 12px;
        }

        .time-block {
            flex: 1;
            background: var(--bg-color);
            padding: 12px 4px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1.1;
        }

        .time-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Form Controls */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-wrapper {
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .styled-input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            font-family: inherit;
            background: var(--card-bg);
            color: var(--text-primary);
        }

        .styled-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
        }

        .tool-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
            width: 100%;
        }

        .tool-btn:hover {
            background-color: var(--accent-active);
        }

        .tool-btn:active {
            transform: scale(0.98);
        }

        /* Calculator Specifics */
        .calc-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .calc-row .styled-input {
            width: 80px;
            text-align: center;
        }

        .result-box {
            margin-top: 20px;
            padding: 16px;
            background: var(--bg-color);
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent);
        }
    </style>
</head>
<body>

<div class="header">
    <h1>WebToolBox</h1>
    <p>Fast, free, lightweight utilities.</p>
</div>

<div class="tools-grid">
    
    <!-- TOOL 1: COUNTDOWN TIMER -->
    <div class="tool-card">
        <h2 class="tool-title">Countdown Timer</h2>
        <div class="countdown-display">
            <div class="time-block"><span id="days" class="time-number">00</span><span class="time-label">Days</span></div>
            <div class="time-block"><span id="hours" class="time-number">00</span><span class="time-label">Hours</span></div>
            <div class="time-block"><span id="minutes" class="time-number">00</span><span class="time-label">Mins</span></div>
            <div class="time-block"><span id="seconds" class="time-number">00</span><span class="time-label">Secs</span></div>
        </div>
        <div class="control-group">
            <div class="input-wrapper">
                <label for="target-date" class="input-label">Select Target Date & Time</label>
                <input type="datetime-local" id="target-date" class="styled-input">
            </div>
            <button id="start-btn" class="tool-btn">Start Countdown</button>
        </div>
    </div>

    <!-- TOOL 2: PERCENTAGE CALCULATOR -->
    <div class="tool-card">
        <h2 class="tool-title">Percentage Calculator</h2>
        <div class="control-group">
            <div class="calc-row">
                <span>What is</span>
                <input type="number" id="calc-pct" class="styled-input" placeholder="15">
                <span>% of</span>
                <input type="number" id="calc-amount" class="styled-input" placeholder="200">
                <span>?</span>
            </div>
            <button id="calc-btn" class="tool-btn">Calculate</button>
            <div id="calc-result" class="result-box">Result: —</div>
        </div>
    </div>

</div>

<script>
// Timer Logic
(function() {
    let countdownInterval;
    const startBtn = document.getElementById('start-btn');
    const datePicker = document.getElementById('target-date');

    startBtn.addEventListener('click', function() {
        const targetInput = datePicker.value;
        if (!targetInput) return alert('Please select a valid date and time.');
        const targetTime = new Date(targetInput).getTime();
        clearInterval(countdownInterval);
        localStorage.setItem('savedTargetTime', targetTime);
        startCountdown(targetTime);
    });

    function startCountdown(endTime) {
        function updateTimer() {
            const distance = endTime - new Date().getTime();
            if (distance < 0) {
                clearInterval(countdownInterval);
                document.querySelectorAll('.time-number').forEach(el => el.innerText = '00');
                localStorage.removeItem('savedTargetTime');
                return;
            }
            document.getElementById('days').innerText = String(Math.floor(distance / 86400000)).padStart(2, '0');
            document.getElementById('hours').innerText = String(Math.floor((distance % 86400000) / 3600000)).padStart(2, '0');
            document.getElementById('minutes').innerText = String(Math.floor((distance % 3600000) / 60000)).padStart(2, '0');
            document.getElementById('seconds').innerText = String(Math.floor((distance % 60000) / 1000)).padStart(2, '0');
        }
        updateTimer();
        countdownInterval = setInterval(updateTimer, 1000);
    }

    const savedTime = localStorage.getItem('savedTargetTime');
    if (savedTime) {
        startCountdown(parseInt(savedTime));
        const dateObj = new Date(parseInt(savedTime));
        datePicker.value = new Date(dateObj - dateObj.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    }
})();

// Calculator Logic
document.getElementById('calc-btn').addEventListener('click', function() {
    const pct = parseFloat(document.getElementById('calc-pct').value);
    const amount = parseFloat(document.getElementById('calc-amount').value);
    const resultBox = document.getElementById('calc-result');
    
    if (isNaN(pct) || !amount) {
        resultBox.innerText = "Please enter valid numbers.";
        return;
    }
    const val = (pct / 100) * amount;
    resultBox.innerText = `Result: ${Number(val.toFixed(4))}`;
});
</script>
</body>
</html>
