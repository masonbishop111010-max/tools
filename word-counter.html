<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word & Character Counter</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); text-align: center; max-width: 500px; width: 100%; }
        h2 { color: var(--accent); margin-top: 0; }
        textarea { width: 95%; height: 150px; padding: 12px; border: 2px solid #475569; background: #0f172a; color: white; border-radius: 6px; font-size: 16px; resize: none; }
        textarea:focus { border-color: var(--accent); outline: none; }
        .stats { display: flex; justify-content: space-around; margin-top: 20px; }
        .stat-box { background: #0f172a; padding: 15px; border-radius: 8px; width: 40%; border: 1px solid #334155; }
        .num { font-size: 28px; color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h2>Word & Character Counter</h2>
    <textarea id="textInput" placeholder="Type or paste your text here..." oninput="count()"></textarea>
    <div class="stats">
        <div class="stat-box"><div>Words</div><div id="wordCount" class="num">0</div></div>
        <div class="stat-box"><div>Characters</div><div id="charCount" class="num">0</div></div>
    </div>
</div>
<script>
    function count() {
        let text = document.getElementById('textInput').value;
        document.getElementById('charCount').innerText = text.length;
        let words = text.trim().split(/\s+/).filter(item => item);
        document.getElementById('wordCount').innerText = words.length;
    }
</script>
</body>
</html>
